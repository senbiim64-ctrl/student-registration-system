<!doctype html>
<html>
<head>
    <title>{% block title %}Student Registration System{% endblock title %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .nav {
            background: #1a73e8;
            padding: 10px;
            border-radius: 5px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            background: #1a73e8;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-success {
            background: #28a745;
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'student_list' %}">Students</a>
        <a href="{% url 'register' %}">Register</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock content %}
    </div>

</body>
</html>
